<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title style="margin-left: 42%;">
      Sánchez Rivera Gregory Ariel
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="false">
    <ion-img class="foto-cv" 
    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8g4-vpRJkKXkGEms1W_RehVw74RTih7QbMQ&s"
    alt="Foto de perfil"
  ></ion-img>

  <ion-card style="width: 50%; margin-left: auto; margin-right: auto;">
    <ion-card-header style="background-color: #3880ff; color: white;">
      <ion-card-title>EXPERIENCIA PREVIA</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <h2>Desarrollador Móvil</h2>
            <h3>Empresa ESFOT</h3>
            <p>2025 - Presente</p>
            <p>Desarrollo de aplicaciones móviles con Angular e Ionic</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-card style="width: 50%; margin-left: auto; margin-right: auto;">
    <ion-card-header style="background-color: #3880ff; color: white;">
      <ion-card-title>IDIOMAS</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label>
            <h2>Español</h2>
            <div class="nivel-de-lenguaje">
              <ion-progress-bar value="1.0"></ion-progress-bar>
              <span class="indicador-de-nivel">Nativo</span>
            </div>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <h2>Inglés</h2>
            <div class="nivel-de-lenguaje">
              <ion-progress-bar value="0.8"></ion-progress-bar>
              <span class="indicador-de-nivel">B2</span>
            </div>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>
            <h2>Portugués</h2>
            <div class="nivel-de-lenguaje">
              <ion-progress-bar value="0.2"></ion-progress-bar>
              <span class="indicador-de-nivel">A1</span>
            </div>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-card style="width: 50%; margin-left: auto; margin-right: auto;">
    <ion-card-header style="background-color: #3880ff; color: white;">
      <ion-card-title>CONOCIMIENTOS</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-chip>JavaScript</ion-chip>
      <ion-chip>Ionic</ion-chip>
      <ion-chip>TypeScript</ion-chip>
      <ion-chip>SQL</ion-chip>
      <ion-chip>HTML</ion-chip>
      <ion-chip>Git</ion-chip>
      <ion-chip>GitHub</ion-chip>
    </ion-card-content>
  </ion-card>
</ion-content>
